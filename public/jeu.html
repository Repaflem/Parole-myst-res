<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuration · Paroles Mystères</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <a href="index.html" class="mark" aria-label="Retour à l'accueil">
    <span class="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </span>
    Paroles Mystères
  </a>

  <main class="config">

    <h1 class="config-title">Configure ta partie</h1>

    <section class="config-sheet">

      <fieldset class="option-field">
        <legend>Style musical</legend>
        <div class="option-group">

          <input type="radio" name="genre" id="genre-all" value="all" class="chip-input" checked>
          <label class="chip" for="genre-all">Tous les styles</label>

          <input type="radio" name="genre" id="genre-variete" value="variete-francaise" class="chip-input">
          <label class="chip" for="genre-variete">Variété française</label>

          <input type="radio" name="genre" id="genre-poprock" value="pop-rock-francais" class="chip-input">
          <label class="chip" for="genre-poprock">Pop / rock français</label>

          <input type="radio" name="genre" id="genre-rap" value="rap-francais" class="chip-input">
          <label class="chip" for="genre-rap">Rap français</label>

          <input type="radio" name="genre" id="genre-actuelle" value="pop-actuelle" class="chip-input">
          <label class="chip" for="genre-actuelle">Pop actuelle</label>

        </div>
      </fieldset>

      <fieldset class="option-field">
        <legend>Époque</legend>
        <div class="option-group">

          <input type="radio" name="era" id="era-all" value="all" class="chip-input" checked>
          <label class="chip" for="era-all">Toutes</label>

          <input type="radio" name="era" id="era-1" value="1960-1979" class="chip-input">
          <label class="chip" for="era-1">1960–1979</label>

          <input type="radio" name="era" id="era-2" value="1980-1989" class="chip-input">
          <label class="chip" for="era-2">1980–1989</label>

          <input type="radio" name="era" id="era-3" value="1990-1999" class="chip-input">
          <label class="chip" for="era-3">1990–1999</label>

          <input type="radio" name="era" id="era-4" value="2000-2009" class="chip-input">
          <label class="chip" for="era-4">2000–2009</label>

          <input type="radio" name="era" id="era-5" value="2010-2019" class="chip-input">
          <label class="chip" for="era-5">2010–2019</label>

          <input type="radio" name="era" id="era-6" value="2020-2026" class="chip-input">
          <label class="chip" for="era-6">2020–2026</label>

        </div>
      </fieldset>

      <fieldset class="option-field">
        <legend>Difficulté</legend>
        <div class="option-group">

          <input type="radio" name="difficulty" id="difficulty-all" value="all" class="chip-input" checked>
          <label class="chip" for="difficulty-all">Toutes</label>

          <input type="radio" name="difficulty" id="difficulty-easy" value="easy" class="chip-input">
          <label class="chip chip-level" for="difficulty-easy">
            <span class="chip-bars lit-1" aria-hidden="true"><span></span><span></span><span></span></span>
            Facile
          </label>

          <input type="radio" name="difficulty" id="difficulty-medium" value="medium" class="chip-input">
          <label class="chip chip-level" for="difficulty-medium">
            <span class="chip-bars lit-2" aria-hidden="true"><span></span><span></span><span></span></span>
            Moyenne
          </label>

          <input type="radio" name="difficulty" id="difficulty-hard" value="hard" class="chip-input">
          <label class="chip chip-level" for="difficulty-hard">
            <span class="chip-bars lit-3" aria-hidden="true"><span></span><span></span><span></span></span>
            Difficile
          </label>

        </div>
      </fieldset>

      <fieldset class="option-field">
        <legend>Nombre de questions</legend>
        <div class="option-group">

          <input type="radio" name="number" id="number-5" value="5" class="chip-input">
          <label class="chip" for="number-5">5</label>

          <input type="radio" name="number" id="number-10" value="10" class="chip-input" checked>
          <label class="chip" for="number-10">10</label>

          <input type="radio" name="number" id="number-15" value="15" class="chip-input">
          <label class="chip" for="number-15">15</label>

          <input type="radio" name="number" id="number-20" value="20" class="chip-input">
          <label class="chip" for="number-20">20</label>

          <input type="radio" name="number" id="number-30" value="30" class="chip-input">
          <label class="chip" for="number-30">30</label>

        </div>
      </fieldset>

      <button type="button" id="start-game" class="btn btn-primary btn-block">
        Lancer la partie
      </button>

    </section>

  </main>

  <footer class="page-footer">
    Paroles Mystères — blind test musical francophone — Créé par Repaflem™
  </footer>

</div>

<script src="js/jeu.js"></script>
</body>
</html>
