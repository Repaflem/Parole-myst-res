<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuration · Paroles Mystères</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <div class="mark">
    <span class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
    Paroles Mystères
  </div>

  <main class="config">

    <div class="center-nav">
      <a href="index.html" class="btn btn-secondary">Retour à l'accueil</a>
    </div>

    <h1 class="config-title">Configure ta partie</h1>

    <section class="config-sheet">

      <div class="field">
        <label for="genre">Style musical</label>
        <select id="genre">
          <option value="all">Tous les styles</option>
          <option value="variete-francaise">Variété française</option>
          <option value="pop-rock-francais">Pop / rock français</option>
          <option value="rap-francais">Rap français</option>
          <option value="pop-actuelle">Pop actuelle</option>
        </select>
      </div>

      <div class="field">
        <label for="era">Époque</label>
        <select id="era">
          <option value="all">Toutes les époques</option>
          <option value="1960-1979">1960 – 1979</option>
          <option value="1980-1989">1980 – 1989</option>
          <option value="1990-1999">1990 – 1999</option>
          <option value="2000-2009">2000 – 2009</option>
          <option value="2010-2019">2010 – 2019</option>
          <option value="2020-2026">2020 – 2026</option>
        </select>
      </div>

      <div class="field">
        <label for="difficulty">Difficulté</label>
        <select id="difficulty">
          <option value="all">Toutes les difficultés</option>
          <option value="easy">Facile</option>
          <option value="medium">Moyenne</option>
          <option value="hard">Difficile</option>
        </select>
      </div>

      <div class="field">
        <label for="number">Nombre de questions</label>
        <select id="number">
          <option value="5">5 questions</option>
          <option value="10" selected>10 questions</option>
          <option value="15">15 questions</option>
          <option value="20">20 questions</option>
          <option value="30">30 questions</option>
        </select>
      </div>

      <button type="button" id="start-game" class="btn btn-primary btn-block">
        Lancer la partie
      </button>

    </section>

  </main>

  <footer class="page-footer">
    Paroles Mystères — blind test musical francophone — Créé par Repaflem™
  </footer>

</div>

<script src="js/jeu.js"></script>
</body>
</html>
