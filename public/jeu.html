<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nouvelle partie · Paroles Mystères</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="container">

        <!-- LOGO -->

        <div class="logo">
            🎵
        </div>

        <h1>
            Nouvelle partie
        </h1>

        <p class="subtitle">
            Configure ta partie avant de commencer
        </p>

        <!-- CONFIGURATION -->

        <section class="card">

            <h2>
                🎮 Configuration
            </h2>

            <p>
                Choisis les paramètres de ta partie.
            </p>

            <!-- STYLE MUSICAL -->

            <div class="game-option">

                <label for="genre">
                    🎼 Style musical
                </label>

                <select id="genre">

                    <option value="all">
                        Tous les styles
                    </option>

                    <option value="francais">
                        Chanson française
                    </option>

                    <option value="pop">
                        Pop
                    </option>

                    <option value="rock">
                        Rock
                    </option>

                    <option value="rap">
                        Rap / Hip-Hop
                    </option>

                    <option value="disco">
                        Disco / Funk
                    </option>

                    <option value="electro">
                        Électro
                    </option>

                    <option value="metal">
                        Métal
                    </option>

                    <option value="international">
                        International
                    </option>

                </select>

            </div>

            <!-- ÉPOQUE -->

            <div class="game-option">

                <label for="era">
                    📅 Époque
                </label>

                <select id="era">

                    <option value="all">
                        Toutes les époques
                    </option>

                    <option value="1960">
                        1960 – 1979
                    </option>

                    <option value="1980">
                        1980 – 1989
                    </option>

                    <option value="1990">
                        1990 – 1999
                    </option>

                    <option value="2000">
                        2000 – 2009
                    </option>

                    <option value="2010">
                        2010 – 2019
                    </option>

                    <option value="2020">
                        2020 – 2026
                    </option>

                </select>

            </div>

            <!-- DIFFICULTÉ -->

            <div class="game-option">

                <label for="difficulty">
                    🧠 Difficulté
                </label>

                <select id="difficulty">

                    <option value="all">
                        Toutes les difficultés
                    </option>

                    <option value="easy">
                        Facile
                    </option>

                    <option value="medium">
                        Moyen
                    </option>

                    <option value="hard">
                        Difficile
                    </option>

                </select>

            </div>

            <!-- NOMBRE DE QUESTIONS -->

            <div class="game-option">

                <label for="number">
                    🔢 Nombre de chansons
                </label>

                <select id="number">

                    <option value="5">
                        5 chansons
                    </option>

                    <option value="10" selected>
                        10 chansons
                    </option>

                    <option value="15">
                        15 chansons
                    </option>

                    <option value="20">
                        20 chansons
                    </option>

                    <option value="30">
                        30 chansons
                    </option>

                </select>

            </div>

            <!-- BOUTON -->

            <a
                href="#"
                class="play-button game-start-button"
            >
                🚀 Commencer la partie
            </a>

        </section>

        <!-- RETOUR -->

        <div class="back-link">

            <a href="index.html">
                ← Retour à l'accueil
            </a>

        </div>

        <footer class="footer">
            Paroles Mystères · Jeu musical
        </footer>

    </main>

    <script src="js/jeu.js"></script>

</body>

</html>
