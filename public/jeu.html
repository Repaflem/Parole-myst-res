<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paroles Mystères - Configuration</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="config-container">

        <div class="logo">
            🎵
        </div>

        <h1>Paroles Mystères</h1>

        <p class="subtitle">
            Configure ta partie
        </p>


        <section class="config-card">

            <h2>🎮 Paramètres de la partie</h2>


            <!-- STYLE MUSICAL -->
            <div class="form-group">

                <label for="genre">
                    🎵 Style musical
                </label>

                <select id="genre">

                    <option value="all">
                        Tous les styles
                    </option>

                    <option value="variete-francaise">
                        🎤 Variété française
                    </option>

                    <option value="pop-rock-francais">
                        🎸 Pop / Rock français
                    </option>

                    <option value="rap-francais">
                        🎤 Rap français
                    </option>

                    <option value="pop-actuelle">
                        🎧 Pop actuelle
                    </option>

                </select>

            </div>


            <!-- ÉPOQUE -->
            <div class="form-group">

                <label for="era">
                    📅 Époque
                </label>

                <select id="era">

                    <option value="all">
                        Toutes les époques
                    </option>

                    <option value="1960-1979">
                        1960 – 1979
                    </option>

                    <option value="1980-1989">
                        1980 – 1989
                    </option>

                    <option value="1990-1999">
                        1990 – 1999
                    </option>

                    <option value="2000-2009">
                        2000 – 2009
                    </option>

                    <option value="2010-2019">
                        2010 – 2019
                    </option>

                    <option value="2020-2026">
                        2020 – 2026
                    </option>

                </select>

            </div>


            <!-- DIFFICULTÉ -->
            <div class="form-group">

                <label for="difficulty">
                    🎯 Difficulté
                </label>

                <select id="difficulty">

                    <option value="all">
                        Toutes les difficultés
                    </option>

                    <option value="easy">
                        🟢 Facile
                    </option>

                    <option value="medium">
                        🟠 Moyenne
                    </option>

                    <option value="hard">
                        🔴 Difficile
                    </option>

                </select>

            </div>


            <!-- NOMBRE DE QUESTIONS -->
            <div class="form-group">

                <label for="number">
                    ❓ Nombre de questions
                </label>

                <select id="number">

                    <option value="5">
                        5 questions
                    </option>

                    <option value="10" selected>
                        10 questions
                    </option>

                    <option value="15">
                        15 questions
                    </option>

                    <option value="20">
                        20 questions
                    </option>

                    <option value="30">
                        30 questions
                    </option>

                </select>

            </div>


            <!-- BOUTON -->
            <button
                type="button"
                class="game-start-button"
                id="start-game"
            >
                🚀 Lancer la partie
            </button>

        </section>


        <a
            href="index.html"
            class="back-link"
        >
            ← Retour à l'accueil
        </a>

    </main>


    <footer>
        Paroles Mystères · Le blind test musical francophone
    </footer>


    <script src="js/jeu.js"></script>

</body>

</html>
