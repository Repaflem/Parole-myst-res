<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question · Paroles Mystères</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <main class="game">

    <header class="game-head">
      <div class="mark">
        <span class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        Paroles Mystères
      </div>
      <p class="score">Score <strong id="score">0</strong></p>
    </header>

    <div class="center-nav">
      <a href="index.html" class="btn btn-secondary">Retour à l'accueil</a>
    </div>

    <p class="game-subnav">
      <a href="jeu.html" class="link-muted">Modifier les paramètres</a>
    </p>

    <div class="progress">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-label">
        Question <span id="current-question">1</span> / <span id="total-questions">10</span>
      </p>
    </div>

    <section class="lyric-panel">
      <p class="lyric-hint">De quelle chanson viennent ces paroles ?</p>
      <p class="lyric-text" id="lyrics">Chargement de la question…</p>
    </section>

    <section class="answer-panel" id="answer-card">

      <div class="field">
        <label for="artist">Artiste</label>
        <input type="text" id="artist" placeholder="Nom de l'artiste" autocomplete="off">
      </div>

      <div class="field">
        <label for="title">Titre de la chanson</label>
        <input type="text" id="title" placeholder="Titre de la chanson" autocomplete="off">
      </div>

      <button type="button" id="validate-answer" class="btn btn-primary btn-block">
        Valider ma réponse
      </button>

    </section>

    <section class="result-panel" id="result-card" style="display: none;">

      <div class="result-marker" id="result-icon"></div>

      <h2 id="result-title">—</h2>
      <p id="result-message">—</p>

      <dl class="result-answer">
        <div>
          <dt>Artiste</dt>
          <dd id="correct-artist">—</dd>
        </div>
        <div>
          <dt>Titre</dt>
          <dd id="correct-title">—</dd>
        </div>
      </dl>

      <div id="audio-container" class="audio-container" style="display: none;"></div>

      <p class="result-points">
        <span id="points-earned">0</span> point(s) gagné(s)
      </p>

      <button type="button" id="next-question" class="btn btn-primary btn-block">
        Question suivante
      </button>

    </section>

  </main>

  <footer class="page-footer">
    Paroles Mystères — blind test musical francophone — Créé par Repaflem™
  </footer>

</div>

<script src="js/question.js"></script>
</body>
</html>
